<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics · Olka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="page">
    <h1 class="page-title">Analytics</h1>
    <p class="lead-left">Totals for the whole protocol. Every number is summed from on-chain events.</p>
    <div class="kpis" id="totals"><p class="empty">Loading…</p></div>
    <h2 class="sub">By chain</h2>
    <div class="table-wrap"><table class="table" id="byChain"><thead><tr><th>Chain</th><th>Coins</th><th>NFTs bought</th><th>Spent (ETH)</th><th>In vaults (ETH)</th></tr></thead><tbody><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div>
    <h2 class="sub">Top coins by fees</h2>
    <div class="table-wrap"><table class="table" id="top"><thead><tr><th>Coin</th><th>Collects</th><th>Fees harvested (ETH)</th><th>NFTs bought</th><th>Given away</th></tr></thead><tbody><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="pages/analytics.js"></script>
</body>
</html>
